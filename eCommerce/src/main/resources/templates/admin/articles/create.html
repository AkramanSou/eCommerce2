<!DOCTYPE html>
<html th:replace="~{base :: html}" lang="fr" xmlns:th="http://www.thymeleaf.org">

<div th:fragment="content">
    <div class="page-hero">
        <div class="container">
            <h1>➕ Nouvel Article</h1>
        </div>
    </div>

    <section class="py-5">
        <div class="container" style="max-width:600px;">
            <form th:action="@{/admin/articles/create}" th:object="${article}" method="post">

                <div class="mb-3">
                    <label class="form-label fw-bold">Nom</label>
                    <input type="text" class="form-control" th:field="*{nom}" required/>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Description</label>
                    <textarea class="form-control" th:field="*{description}" rows="3"></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Prix (€)</label>
                    <input type="number" step="0.01" class="form-control" th:field="*{prix}" required/>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Stock</label>
                    <input type="number" class="form-control" th:field="*{stock}" required/>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Icône (emoji)</label>
                    <input type="text" class="form-control" th:field="*{icone}"/>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">Catégorie</label>
                    <select class="form-select" name="categorieId" required>
                        <option value="">-- Choisir une catégorie --</option>
                        <option th:each="cat : ${categories}"
                                th:value="${cat.id}"
                                th:text="${cat.nom}">Catégorie</option>
                    </select>
                </div>

                <div class="d-flex gap-3">
                    <button type="submit" class="btn-rouge">Enregistrer</button>
                    <a th:href="@{/admin/articles}" class="btn btn-secondary">Annuler</a>
                </div>

            </form>
        </div>
    </section>
</div>
</html>
