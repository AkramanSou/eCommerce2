<!DOCTYPE html>
<html th:replace="~{base :: html}" lang="fr" xmlns:th="http://www.thymeleaf.org">

<div th:fragment="content">
    <div class="page-hero">
        <div class="container">
            <h1>⚙️ Admin - Articles</h1>
            <p style="color:rgba(255,255,255,0.6);margin-top:6px;">Gérer les articles</p>
        </div>
    </div>

    <section class="py-5">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="section-title">Articles</h2>
                <a th:href="@{/admin/articles/create}" class="btn-rouge">+ Nouvel article</a>
            </div>

            <table class="table table-bordered">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Icône</th>
                    <th>Nom</th>
                    <th>Prix</th>
                    <th>Stock</th>
                    <th>Catégorie</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="article : ${articles}">
                    <td th:text="${article.id}">1</td>
                    <td th:text="${article.icone}">🥊</td>
                    <td th:text="${article.nom}">Nom</td>
                    <td th:text="${article.prix} + ' €'">0 €</td>
                    <td th:text="${article.stock}">0</td>
                    <td th:text="${article.categorie?.nom}">Catégorie</td>
                    <td>
                        <a th:href="@{/admin/articles/edit/{id}(id=${article.id})}"
                           class="btn btn-sm btn-warning me-2">Modifier</a>
                        <form th:action="@{/admin/articles/delete/{id}(id=${article.id})}"
                              method="post" style="display:inline;">
                            <button type="submit" class="btn btn-sm btn-danger"
                                    onclick="return confirm('Supprimer cet article ?')">
                                Supprimer
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</div>
</html>
