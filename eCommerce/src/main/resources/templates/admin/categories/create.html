<!DOCTYPE html>
<html th:replace="~{base :: html}" lang="fr" xmlns:th="http://www.thymeleaf.org">

<div th:fragment="content">
    <div class="page-hero">
        <div class="container">
            <h1>➕ Nouvelle Catégorie</h1>
        </div>
    </div>

    <section class="py-5">
        <div class="container" style="max-width:600px;">
            <form th:action="@{/admin/categories/create}" th:object="${categorie}" method="post">

                <div class="mb-3">
                    <label class="form-label fw-bold">Nom</label>
                    <input type="text" class="form-control" th:field="*{nom}" required/>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Description</label>
                    <textarea class="form-control" th:field="*{description}" rows="3"></textarea>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">Icône (emoji)</label>
                    <input type="text" class="form-control" th:field="*{icone}"/>
                </div>

                <div class="d-flex gap-3">
                    <button type="submit" class="btn-rouge">Enregistrer</button>
                    <a th:href="@{/admin/categories}" class="btn btn-secondary">Annuler</a>
                </div>

            </form>
        </div>
    </section>
</div>
</html>
