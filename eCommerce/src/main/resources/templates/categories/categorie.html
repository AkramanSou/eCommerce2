<!DOCTYPE html>
<html th:replace="~{base :: html}" lang="fr" xmlns:th="http://www.thymeleaf.org">

<div th:fragment="content">

    <div class="page-hero">
        <div class="container">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/}">Accueil</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/boutique}">Boutique</a></li>
                    <li class="breadcrumb-item active" th:text="${categorie.nom}">Catégorie</li>
                </ol>
            </nav>
            <h1>
                <span th:text="${categorie.icone}">🥊</span>
                <span th:text="${categorie.nom}">Catégorie</span>
            </h1>
            <p style="color:rgba(255,255,255,0.6);margin-top:6px;" th:text="${categorie.description}">Description</p>
        </div>
    </div>

    <section class="py-5">
        <div class="container">

            <!-- Si aucun article -->
            <div th:if="${#lists.isEmpty(articles)}" class="text-center py-5">
                <div style="font-size:4rem;">📦</div>
                <h4 class="mt-3">Aucun article dans cette catégorie</h4>
                <a th:href="@{/boutique}" class="btn-rouge mt-3 d-inline-block">Voir la boutique</a>
            </div>

            <!-- Liste des articles -->
            <div class="row g-4" th:unless="${#lists.isEmpty(articles)}">
                <div class="col-6 col-md-4 col-lg-3" th:each="article : ${articles}">
                    <div class="product-card">
                        <div class="product-img">
                            <span th:text="${article.icone}">🥊</span>
                        </div>
                        <div class="product-body">
                            <div class="product-name" th:text="${article.nom}">Nom</div>
                            <div class="product-sub" th:text="${article.description}">Description</div>
                            <div class="d-flex align-items-center justify-content-between">
                                <span class="price" th:text="${article.prix} + ' €'">0 €</span>
                                <button class="btn-cart"><i class="bi bi-bag-plus"></i></button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </section>

</div>
</html>
