<!DOCTYPE html>
<html th:replace="~{base}" lang="fr" xmlns:th="http://www.thymeleaf.org">

<div th:fragment="content">

  <div class="page-hero">
    <div class="container">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a th:href="@{/}">Accueil</a></li>
          <li class="breadcrumb-item"><a th:href="@{/boutique}">Boutique</a></li>
          <li class="breadcrumb-item active">Vêtements</li>
        </ol>
      </nav>
      <h1>🎽 Vêtements</h1>
      <p style="color:rgba(255,255,255,0.6);margin-top:6px;">Shorts, t-shirts, hoodies — performants et stylés</p>
    </div>
  </div>

  <section class="py-5">
    <div class="container">

<!--      <div class="d-flex gap-2 flex-wrap mb-4">-->
<!--        <button class="filter-btn active">Tous</button>-->
<!--        <button class="filter-btn">Shorts</button>-->
<!--        <button class="filter-btn">T-shirts</button>-->
<!--        <button class="filter-btn">Hoodies</button>-->
<!--        <button class="filter-btn">Rash Guards</button>-->
<!--      </div>-->

        <div class="row g-4">
            <div class="col-6 col-md-4 col-lg-3" th:each="article : ${articles}">
                <div class="product-card">
                    <div class="product-img">
                        <span th:text="${article.icone}">🥊</span>
                    </div>
                    <div class="product-body">
                        <div class="product-name" th:text="${article.nom}">Nom</div>
                        <div class="product-sub" th:text="${article.description}">Description</div>
                        <div class="d-flex align-items-center justify-content-between">
                            <span class="price" th:text="${article.prix} + ' €'">0 €</span>
                            <button class="btn-cart"><i class="bi bi-bag-plus"></i></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
  </section>

</div>
</html>
